<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>DevClub - Conversor de Moedas</title>
</head>
<body>

    <img src="./assets/logo.gif" alt="Logo do DevClub" class="logo">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>
        </label>

        <label>
            Valor
            <input class="value-input" placeholder="Digite o valor: R$ 0,00">
        </label>

        <button id="convert-button">Converter</button>

        <section>
            <div class="result">
                <img  class="img-real" src="./assets/real.png" alt="Moeda Real">
                <p class="currency">Real</p>
                <p class="currency-value-convert">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="./assets/arrow.png" alt="Seta">

            <div class="result">
                <img class="currency-img" src="./assets/dolar.png" alt="Moeda Dólar Americano">
                <p class="currency" id="currency-name">Dólar Americano</p>
                <p class="currency-value">US$ 0,00</p>
            </div>
        </section>
        
    </main>
</body>
<script src="./script.js"></script>
</html>
